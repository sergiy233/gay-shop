<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Store Prototype</title>
    <style>
        :root {
            --primary: #2563eb;
            --accent: #10b981;
            --bg: #f8fafc;
            --text: #1e293b;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        /* Контейнер */
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Шапка з пошуком */
        .header {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
            text-align: center;
        }

        .search-bar {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 30px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-bar input:focus {
            border-color: var(--primary);
        }

        /* Сітка товарів */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        /* Картка товару */
        .card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }

        .image-box {
            width: 100%;
            height: 200px;
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--accent);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .content {
            padding: 20px;
            flex-grow: 1;
        }

        .category {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .title {
            margin: 8px 0;
            font-size: 18px;
            font-weight: 700;
        }

        .price {
            font-size: 20px;
            color: var(--primary);
            font-weight: 800;
            margin: 15px 0;
        }

        .price.free {
            color: var(--accent);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: var(--text);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Каталог Послуг</h1>
            <div class="search-bar">
                <input type="text" placeholder="Що ви шукаєте? (наприклад: Консультація)">
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <div class="image-box">
                    <span class="badge">PROMO</span>
                    <img src="images.jpg" alt="Free" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <div class="content">
                    <div class="category">бдсм</div>
                    <div class="title">Артем Степанович</div>
                    <div class="price free">БЕЗКОШТОВНО</div>
                    <button class="btn">Забронювати</button>
                </div>
            </div>

            <div class="card">
                <div class="image-box">
                    <img src="Без названия.jpg" alt="Service" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <div class="content">
                    <div class="category">Масло</div>
                    <div class="title">Підіді</div>
                    <div class="price">1 200 грн/год</div>
                    <button class="btn">Замовити</button>
                </div>
            </div>

            <div class="card">
                <div class="image-box">
                    <img src="Без названия (2).jpg" alt="Service" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <div class="content">
                    <div class="category">остров</div>
                    <div class="title">Джефрі Епштейн</div>
                    <div class="price">2 500 грн/год</div>
                    <button class="btn">Замовити</button>
                </div>
            </div>

            <div class="card">
                <div class="image-box">
                    <img src="YS2HPHNlS2OzyZaKQ2-e1DxqU1KmWz1oqb_EJGB3m2o.webp" alt="Service" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <div class="content">
                    <div class="category">ротік </div>
                    <div class="title">Левчук влад</div>
                    <div class="price">1 800 грн/год</div>
                    <button class="btn">Замовити</button>
                </div>
            </div>

            <div class="card">
                <div class="image-box">
                    <img src="i-want-to-become-femboy-but-im-kinda-jacked-does-jacked-v0-sodqcp4jsdlc1.webp" alt="Service" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <div class="content">
                    <div class="category">комбо</div>
                    <div class="title">Матвій Твофичук</div>
                    <div class="price">3 000 грн/год</div>
                    <button class="btn">Замовити</button>
                </div>
            </div>

            <div class="card">
                <div class="image-box">
                    <img src="images (1).jpg" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <div class="content">
                    <div class="category">анал</div>
                    <div class="title">Галейчук Микола</div>
                    <div class="price">1 500 грн/год</div>
                    <button class="btn">Замовити</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
